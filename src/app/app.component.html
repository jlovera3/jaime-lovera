@if (cv; as cvLanguage) {
  <app-cv [lang]="cvLanguage" />
} @else {
  <a class="skip-link" href="#main">{{ content().a11y.skipToContent }}</a>

  <div class="backdrop" aria-hidden="true">
    <span class="orb orb--a"></span>
    <span class="orb orb--b"></span>
    <span class="orb orb--c"></span>
    <span class="grid"></span>
    <span class="noise"></span>
  </div>

  <div class="scroll-progress" aria-hidden="true"></div>
  <app-cursor-light />

  @if (intro.stage() !== 'done') {
    <app-splash />
  }

  <!-- While the splash plays, the page underneath is inert (no focus, no screen-reader noise) -->
  <div [attr.inert]="intro.stage() === 'playing' ? '' : null">
    <app-nav />
    <main id="main">
      <app-hero appScrollProgress="exit" />
      <app-marquee />
      <app-statement />
      <app-about />
      <app-impact />
      <app-experience />
      <app-work />
      <app-skills />
      <app-contact />
    </main>
    <app-footer />
  </div>
}
