<ion-header class="flex mt-[env(safe-area-inset-top)] p-4 pt-10">
  <button type="button" aria-label="Close" class="bg-transparent" (click)="dismiss()">
    <ion-icon [icon]="closeOutline" class="h-6 w-6" aria-hidden="true"></ion-icon>
  </button>
  <div class="h-auto w-20 justify-center align-middle text-center ml-[32%]">
    <img
      [src]="'assets/companies/' + company().logo + '.png'"
      [alt]="company().name"
      class="max-w-[100%] max-h-[100%]"
    />
  </div>
</ion-header>
<ion-content>
  <ion-card>
    <ion-card-header class="text-center pb-0">
      <ion-item>
        <ion-label>
          <h1 class="whitespace-break-spaces">{{ company().role }}</h1>
        </ion-label>
      </ion-item>
    </ion-card-header>
    <ion-card-content class="m-4">
      <ion-label>
        <h2>{{ company().duration }}</h2>
      </ion-label>
    </ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-header class="text-center pb-0">
      <ion-item>
        <ion-label><h1>Projects</h1></ion-label>
      </ion-item>
    </ion-card-header>
    <ion-card-content>
      <div class="flex flex-wrap">
        @for (project of company().projects; track project.name; let index = $index) {
          <div class="w-1/4" [class.project-animate]="animatedProjects().includes(index)">
            <app-project [project]="project"></app-project>
          </div>
        }
      </div>
    </ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-header class="text-center pb-0">
      <ion-item>
        <ion-label><h1>Responsabilities</h1></ion-label>
      </ion-item>
    </ion-card-header>
    <ion-card-content>
      @for (resp of company().responsabilities; track resp) {
        <ion-item>
          <ion-label>
            <p class="whitespace-break-spaces">{{ resp }}</p>
          </ion-label>
        </ion-item>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
