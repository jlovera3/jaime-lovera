<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jaime Lovera — Frontend Engineer & Technical Project Lead</title>
    <base href="/" />

    <meta name="description" content="Frontend engineer and technical project lead building and leading polished web and mobile products. Portfolio and CV of Jaime Lovera." />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06060a" />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f7f7fa';
        }
      } catch (e) {}
    </script>
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jaime Lovera — Frontend Engineer & Technical Project Lead" />
    <meta property="og:description" content="Frontend engineer and technical project lead building and leading polished web and mobile products." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
    <link rel="canonical" href="https://jaime-lovera.pages.dev/" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jaime Lovera",
        "jobTitle": "Frontend Engineer & Technical Project Lead",
        "url": "https://jaime-lovera.pages.dev/",
        "sameAs": ["https://www.linkedin.com/in/jaime-lovera/", "https://github.com/jlovera3"],
        "worksFor": { "@type": "Organization", "name": "knowmad mood", "url": "https://www.knowmadmood.com/" }
      }
    </script>

    <style>
      /* Paint the dark background before the bundle loads to avoid a white flash */
      html { background: #06060a; }
      html[data-theme='light'] { background: #f7f7fa; }
      .boot { position: fixed; inset: 0; margin: auto; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.35; transform: scale(0.8); } }
    </style>
  </head>
  <body>
    <app-root>
      <!-- Painted before Angular boots; replaced by the app on bootstrap -->
      <svg class="boot" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="7" fill="#8b8cff" />
      </svg>
    </app-root>
    <noscript>Jaime Lovera — Frontend Engineer &amp; Technical Project Lead. Please enable JavaScript to view this portfolio.</noscript>
  </body>
</html>
