<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Mono'; font-weight: 100 800; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #06060a; }
  body { position: relative; font-family: 'Geist', sans-serif; color: #f3f3f6; -webkit-font-smoothing: antialiased; }

  /* Ambient aurora + grid, same language as the site */
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .a { width: 720px; height: 720px; left: -200px; top: -320px; background: radial-gradient(circle, rgb(99 102 241 / .62), transparent 66%); }
  .b { width: 620px; height: 620px; right: -160px; top: 120px; background: radial-gradient(circle, rgb(45 212 191 / .34), transparent 66%); }
  .c { width: 560px; height: 560px; left: 320px; bottom: -340px; background: radial-gradient(circle, rgb(168 85 247 / .32), transparent 66%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px); background-size: 60px 60px; mask: radial-gradient(ellipse 80% 90% at 30% 40%, #000 15%, transparent 78%); }
  .frame { position: absolute; inset: 24px; border: 1px solid rgb(255 255 255 / .1); border-radius: 28px; }

  .content { position: absolute; inset: 0; padding: 64px 84px 62px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-family: 'Mono', monospace; font-size: 19px; letter-spacing: .16em; text-transform: uppercase; color: #a3a3b0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 16px #5eead4; }
  h1 { margin-top: 24px; font-size: 108px; line-height: .98; font-weight: 650; letter-spacing: -.05em; }
  .tag { margin-top: 22px; font-size: 38px; line-height: 1.15; font-weight: 500; letter-spacing: -.02em; color: #c9c9d3; }
  .grad { background: linear-gradient(115deg, #8b8cff 10%, #5eead4 90%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
  .foot { display: flex; align-items: center; gap: 22px; }
  .url { font-family: 'Mono', monospace; font-size: 22px; letter-spacing: .04em; color: #f3f3f6; padding: 12px 22px; border: 1px solid rgb(255 255 255 / .2); border-radius: 999px; background: rgb(255 255 255 / .05); }
  .stack { font-size: 22px; color: #8b8b98; letter-spacing: -.01em; }

  /* Portrait with the gradient halo */
  .portrait { position: absolute; right: 92px; top: 50%; width: 400px; height: 400px; margin-top: -200px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, #8b8cff, #5eead4, transparent 55%, #8b8cff); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
  .glow { position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgb(139 140 255 / .38), transparent 68%); filter: blur(28px); }
  .photo { position: absolute; inset: 18px; border-radius: 50%; overflow: hidden; background: #0c0c13; box-shadow: 0 30px 80px -20px rgb(139 140 255 / .55); }
  .photo img { width: 100%; height: 100%; object-fit: cover; scale: 1.08; }
</style>
</head>
<body>
  <span class="orb a"></span><span class="orb b"></span><span class="orb c"></span>
  <span class="grid"></span><span class="frame"></span>

  <div class="content">
    <div>
      <p class="eyebrow"><span class="dot"></span>Portfolio · CV</p>
      <h1>Jaime<br />Lovera</h1>
      <p class="tag">Frontend Engineer &amp;<br /><span class="grad">Technical Project Lead</span></p>
    </div>
    <div class="foot">
      <span class="url">jaime-lovera.pages.dev</span>
      <span class="stack">Angular · TypeScript · Ionic · Vue.js</span>
    </div>
  </div>

  <div class="portrait">
    <span class="glow"></span>
    <span class="ring"></span>
    <span class="photo"><img src="{{PHOTO}}" alt="" /></span>
  </div>
</body>
</html>
